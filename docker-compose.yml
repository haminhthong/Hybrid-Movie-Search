services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports: ["6333:6333"]
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./pipeline/data:/app/pipeline/data
    ports: ["8000:8000"]
    depends_on:
      - qdrant

  app:
    build: .
    env_file: .env
    environment:
      MOVIESCOUT_API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      - api

volumes:
  qdrant_data:
