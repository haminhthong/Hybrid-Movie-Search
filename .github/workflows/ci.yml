name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            fastapi==0.115.8 \
            "httpx>=0.27" \
            numpy==2.2.3 \
            pandas==2.2.3 \
            python-dotenv==1.0.1 \
            qdrant-client==1.13.2 \
            "pytest>=8.0.0" \
            "pytest-cov>=5.0.0" \
            ruff==0.9.7
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q app evaluation experiments pipeline retrieval scripts tests ui
      - name: Test
        run: python -m pytest tests -q
